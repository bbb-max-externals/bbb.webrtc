name: Build & Package

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache OpenSSL (Universal Binary)
        id: cache-openssl
        uses: actions/cache@v4
        with:
          path: /tmp/openssl-universal
          key: openssl-3.3.2-universal-macos-v1

      - name: Build OpenSSL (Universal Binary)
        if: steps.cache-openssl.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/openssl/openssl.git --branch openssl-3.3.2 --depth 1 /tmp/openssl-src
          cd /tmp/openssl-src

          # Build for arm64
          ./Configure darwin64-arm64-cc no-shared no-tests --prefix=/tmp/ssl-arm64
          make -j$(sysctl -n hw.logicalcpu) && make install_sw && make clean

          # Build for x86_64 (cross-compile)
          ./Configure darwin64-x86_64-cc no-shared no-tests --prefix=/tmp/ssl-x86_64
          make -j$(sysctl -n hw.logicalcpu) && make install_sw

          # Create universal static libraries
          mkdir -p /tmp/openssl-universal/lib /tmp/openssl-universal/include
          cp -r /tmp/ssl-arm64/include/openssl /tmp/openssl-universal/include/
          lipo -create \
            /tmp/ssl-arm64/lib/libssl.a \
            /tmp/ssl-x86_64/lib/libssl.a \
            -output /tmp/openssl-universal/lib/libssl.a
          lipo -create \
            /tmp/ssl-arm64/lib/libcrypto.a \
            /tmp/ssl-x86_64/lib/libcrypto.a \
            -output /tmp/openssl-universal/lib/libcrypto.a

      - name: Configure and Build
        run: |
          cmake -B build \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" \
            -DCMAKE_BUILD_TYPE=Release \
            -DOPENSSL_ROOT_DIR=/tmp/openssl-universal \
            -DOPENSSL_USE_STATIC_LIBS=ON \
            -DBBB_WEBRTC_BUILD_TESTS=ON
          cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Verify Universal Binary
        run: |
          for f in externals/*.mxo/Contents/MacOS/*; do
            echo "=== $f ==="
            lipo -info "$f"
          done

      - name: Sign macOS externals
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        shell: bash
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: .github/scripts/macos-direct-distribution.sh sign externals

      - name: Archive macOS externals
        shell: bash
        run: .github/scripts/macos-direct-distribution.sh archive externals "$RUNNER_TEMP/macos-externals.zip"

      - name: Upload externals
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-macos
          path: ${{ runner.temp }}/macos-externals.zip

  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache OpenSSL (x64)
        id: cache-openssl
        uses: actions/cache@v4
        with:
          path: C:\openssl
          key: openssl-3.3.2-x64-windows-noasm-v1

      - name: Build OpenSSL (x64)
        if: steps.cache-openssl.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          git clone https://github.com/openssl/openssl.git --branch openssl-3.3.2 --depth 1 C:\openssl-src
          cd /d C:\openssl-src
          perl Configure VC-WIN64A no-shared no-tests no-asm --prefix=C:\openssl
          REM Match /MT (static CRT) used by min-api and our CMake config
          powershell -Command "(Get-Content makefile -Raw).Replace('/MDd','/MTd').Replace('/MD ','/MT ') | Set-Content makefile -NoNewline"
          nmake
          nmake install_sw

      - name: Configure and Build
        shell: pwsh
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 `
            -DOPENSSL_ROOT_DIR=C:\openssl `
            -DOPENSSL_USE_STATIC_LIBS=ON `
            -DBBB_WEBRTC_BUILD_TESTS=ON
          cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Upload externals
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-windows
          path: externals/

  package:
    permissions:
      contents: write
    needs: [build-macos, build-windows]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download macOS externals
        uses: actions/download-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-macos
          path: ${{ runner.temp }}/macos-artifact

      - name: Restore signed macOS externals
        shell: bash
        run: .github/scripts/macos-direct-distribution.sh extract "$RUNNER_TEMP/macos-artifact/macos-externals.zip" "dist/${{ github.event.repository.name }}"


      - name: Download Windows externals
        uses: actions/download-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-windows
          path: dist/${{ github.event.repository.name }}/externals/

      - name: Assemble package
        shell: bash
        run: |
          set -euo pipefail
          PKG="dist/${{ github.event.repository.name }}"
          mkdir -p "$PKG"
          for file in package-info.json README.md LICENSE; do
            if [ -f "$file" ]; then
              cp "$file" "$PKG/"
            fi
          done
          for dir in help extra extras patchers patches docs schemas examples media; do
            if [ -d "$dir" ]; then
              cp -R "$dir" "$PKG/"
            fi
          done

      - name: Create macOS-preserving archive
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          ditto -c -k --keepParent "${{ github.event.repository.name }}" "${{ github.event.repository.name }}.zip"

      - name: Notarize and verify public archive
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY_P8_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_P8_BASE64 }}
        run: .github/scripts/macos-direct-distribution.sh notarize-and-verify "dist/${{ github.event.repository.name }}.zip" "${{ github.event.repository.name }}"

      - name: Generate archive checksum
        shell: bash
        run: .github/scripts/macos-direct-distribution.sh checksum "dist/${{ github.event.repository.name }}.zip"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-latest
          path: |
            dist/${{ github.event.repository.name }}.zip
            dist/${{ github.event.repository.name }}.zip.sha256

      - name: Update latest package release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ZIP="dist/${{ github.event.repository.name }}.zip"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f latest "${GITHUB_SHA}"
          git push origin refs/tags/latest --force
          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --title "Latest package" --notes "Automatically updated from main at ${GITHUB_SHA}."
            gh release upload latest "$ZIP" "${ZIP}.sha256" --clobber
          else
            gh release create latest "$ZIP" "${ZIP}.sha256" --title "Latest package" --notes "Automatically updated from main at ${GITHUB_SHA}." --latest
          fi

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/${{ github.event.repository.name }}.zip
            dist/${{ github.event.repository.name }}.zip.sha256
